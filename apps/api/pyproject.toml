[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_api"]

[project]
name = "platform-api"
version = "0.1.0"
description = "FastAPI Modular-Monolith Backend Application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "platform-core",
    "platform-domain-events",
    "pyjwt[crypto]>=2.13.0",
    # Form posts. The customer accepts or declines a quote from the document
    # itself, and that has to be a POST: a GET accept-link is fetched by
    # WhatsApp and email link-preview bots, which would silently accept quotes
    # nobody clicked.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = [
    "platform-testing",
]

[tool.uv.sources]
platform-core = { workspace = true }
platform-domain-events = { workspace = true }
platform-testing = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "../../python/testing",
    "../worker/src",
]
asyncio_mode = "auto"

