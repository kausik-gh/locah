[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-core"
version = "0.1.0"
description = "Platform Core Shared Backend Library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "google-genai>=1.0.0",
]
