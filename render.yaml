# LOCAH API + worker on Render. Uses the existing Supabase/Postgres project —
# this Blueprint does not provision a second database.
services:
  - type: web
    name: locah-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: infra/docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_TRUST_XFF
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        value: https://locah-web.vercel.app,https://locah-workspace.vercel.app,https://locah-admin.vercel.app
      - key: NEXT_PUBLIC_WEB_URL
        value: https://locah-web.vercel.app
      - key: NEXT_PUBLIC_WORKSPACE_URL
        value: https://locah-workspace.vercel.app
      - key: PLATFORM_DOMAIN
        value: locah-web.vercel.app
      - key: AI_PROVIDER
        value: xai
      - key: XAI_MODEL
        value: grok-4.3
      - key: XAI_IMAGE_MODEL
        value: grok-imagine-image-2.0
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: DATABASE_URL
        sync: false
      - key: API_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: WEBSITE_PREVIEW_SECRET
        sync: false

  - type: worker
    name: locah-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: infra/docker/Dockerfile.worker
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: xai
      - key: XAI_MODEL
        value: grok-4.3
      - key: XAI_IMAGE_MODEL
        value: grok-imagine-image-2.0
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: WEBSITE_PREVIEW_SECRET
        sync: false
